# Proposed only. Never used by the frozen qualification build.
change-id = "ignore"

[build]
build-stage = 1
jobs = 2
docs = false
compiler-docs = false
submodules = false
locked-deps = true
extended = false
profiler = true
print-step-timings = true
print-step-rusage = true

[rust]
download-rustc = false
optimize = true
incremental = false
debug-assertions = false
debug-assertions-tools = false
overflow-checks = false
debug-assertions-std = false
overflow-checks-std = false
debug-logging = false
debuginfo-level = 1
codegen-units = 16
lto = "thin-local"
channel = "dev"
omit-git-hash = false
lld = false
llvm-tools = false
remap-debuginfo = true

[llvm]
download-ci-llvm = true
link-shared = true
