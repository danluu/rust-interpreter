[package]
name = "rust-interp-bytecode"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"

[[bin]]
name = "rust-interp-vm"
path = "src/main.rs"

[[bin]]
name = "scalar-abi-check"
path = "src/scalar_abi_check.rs"

[[bin]]
name = "scalar-cli-fixture"
path = "src/scalar_cli_fixture.rs"
