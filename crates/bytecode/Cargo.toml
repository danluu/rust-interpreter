[package]
name = "rust-interp-bytecode"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }

[[bin]]
name = "rust-interp-vm"
path = "src/main.rs"

[[bin]]
name = "rust-interp-register-census"
path = "src/register_census.rs"

[[bin]]
name = "rust-interp-lifetime-census"
path = "src/lifetime_census.rs"

[[bin]]
name = "rust-interp-call-census"
path = "src/call_census.rs"

[[bin]]
name = "rust-interp-address-census"
path = "src/address_census.rs"

# Explicit diagnostics only; absent from ordinary VM builds.
[features]
indirect-target-observer = []
# Experimental trusted in-memory reuse across fully checked Programs.
jit-template-session = []
# Bounded diagnostic counters only; never used for acceptance timing.
jit-preparation-observer = ["jit-template-session"]
# Experimental size tier; explicit candidate builds only.
jit-large-function-interpreter = ["jit-template-session"]
# Experimental request-local reuse of a digest computed from owned bytes.
jit-artifact-digest-reuse = ["jit-large-function-interpreter"]
# Experimental buffering; preserves the exact v3 template key bytes and digest.
jit-buffered-template-keys = ["jit-artifact-digest-reuse"]
# Diagnostic only: bounded per-function history events, absent from normal builds.
jit-template-miss-observer = ["jit-artifact-digest-reuse", "jit-preparation-observer"]

[[bin]]
name = "rust-interp-indirect-observer"
path = "src/indirect_observer.rs"
required-features = ["indirect-target-observer"]

[[bin]]
name = "rust-interp-template-session"
path = "src/template_session.rs"
required-features = ["jit-template-session"]
