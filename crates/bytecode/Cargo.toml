[package]
name = "rust-interp-bytecode"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }

[[bin]]
name = "rust-interp-vm"
path = "src/main.rs"

[[bin]]
name = "rust-interp-register-census"
path = "src/register_census.rs"

[[bin]]
name = "rust-interp-lifetime-census"
path = "src/lifetime_census.rs"
