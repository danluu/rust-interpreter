[package]
name = "rust-interp-mir-export"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "rust-interp-rustc-wrapper"
path = "src/wrapper_main.rs"

[dependencies]
rust-interp-bytecode = { path = "../bytecode" }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
